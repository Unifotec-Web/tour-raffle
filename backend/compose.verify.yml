name: tour-raffle-verify

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tour_raffle_verify
      POSTGRES_USER: tour_raffle_verify
      POSTGRES_PASSWORD: local-verify-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour_raffle_verify -d tour_raffle_verify"]
      interval: 2s
      timeout: 2s
      retries: 20
